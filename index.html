<!DOCTYPE html>
<script>window.onerror=function(m,u,l){alert("エラー:\n"+m+"\n行:"+l);};</script>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学童野球 1球速報 - gakudo-baseball-score</title>
  
  <!-- ユーティリティCSS (Tailwind CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 分割CSSの読み込み -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body class="min-h-screen lg:h-screen lg:overflow-hidden flex flex-col items-center p-2 sm:p-3 bg-[#0b1329] text-slate-100 font-sans select-none justify-between">

  <!-- 1. アプリヘッダー (PCでは最大幅を広げて広々表示) -->
  <header class="w-full max-w-lg lg:max-w-6xl mb-1.5 flex items-center justify-between border-b border-slate-800 pb-2 flex-shrink-0">
    <div>
      <div class="flex items-center gap-1.5">
        <span class="text-xl">⚾️</span>
        <h1 class="text-base sm:text-lg font-bold text-emerald-400">学童野球 1球速報</h1>
        <span class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">v1.0</span>
      </div>
      <p class="text-[10px] text-slate-400 hidden sm:block">gakudo-baseball-score</p>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="btn-open-roster" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-sky-400 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-sky-900/50 flex items-center gap-1 shadow">
        📋 オーダー
      </button>
      <button id="btn-export-csv" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-emerald-400 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-emerald-900/50 flex items-center gap-1 shadow" title="公式スコアCSVを保存">
        📤 CSV
      </button>
      <button id="btn-undo" class="bg-amber-600 hover:bg-amber-500 active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow">
        ↺ 1球取消 <span class="hidden lg:inline text-[10px] opacity-80">(Ctrl+Z)</span>
         </button>
    　<button id="btn-reset-game" class="bg-rose-950/80 hover:bg-rose-900 border border-rose-800 active:scale-95 text-rose-300 text-xs font-bold px-2.5 py-1.5 rounded-lg flex items-center gap-1 shadow" title="試合を最初からやり直す">
 　　　 🗑 リセット
　　　</button>
    </div>
  </header>

  <!-- 2. メインコンテンツ: PCでは左右均等2カラム、スクロールなしフィット -->
  <div class="w-full max-w-lg lg:max-w-6xl flex-1 flex flex-col lg:flex-row gap-3 items-stretch overflow-y-auto lg:overflow-hidden pb-1">
    
    <!-- 【左カラム】試合状況（スコアボード・走者BSO・直近投球ログ） -->
    <div class="w-full lg:w-1/2 flex flex-col gap-2 justify-between">
      <!-- スコアボード & 球数・タイマー管理 -->
      <section id="scoreboard-slot" class="w-full">
        <!-- scoreboard.js が描画 -->
      </section>

      <!-- 走者ダイアモンド & BSOカウントランプ -->
      <section id="diamond-slot" class="w-full">
        <!-- runnerDiamond.js が描画 -->
      </section>

      <!-- 直近投球ログスロット -->
      <section id="log-slot" class="bg-slate-900 border border-slate-800 rounded-2xl p-2.5 shadow text-xs flex-1 flex flex-col justify-center min-h-[70px]">
        <!-- runnerDiamond.js が更新 -->
      </section>
    </div>

    <!-- 【右カラム】投球入力コンソール（17分割盤面 & 判定ボタン） -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center">
      <main class="w-full">
        <section id="zone-slot">
          <!-- zone.js がプロ仕様コンソールを描画 -->
        </section>
      </main>
    </div>
 
    <!-- 追加イメージ：誤操作防止の安全ダイアログ -->
<div id="reset-confirm-modal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 max-w-xs w-full shadow-2xl space-y-3 text-center">
    <div class="text-3xl">⚠️</div>
    <h3 class="text-sm font-black text-white">試合を初期化しますか？</h3>
    <p class="text-xs text-slate-400">現在のスコア、カウント、投球履歴はすべて消去され、1回表・0球に戻ります。</p>
    <div class="flex gap-2 pt-2">
      <button id="btn-cancel-reset" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-xs font-bold">
        キャンセル
      </button>
      <button id="btn-confirm-reset" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2 rounded-xl text-xs font-black shadow">
        初期化する
      </button>
    </div>
  </div>
</div>
  </div>

  <!-- 3. モーダルスロット -->
  <div id="spray-modal-slot" class="hidden"></div>
  <div id="roster-modal-slot" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-40 p-3 overflow-y-auto flex items-center justify-center"></div>

  <!-- 4. ES Modules エントリーポイント -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
