<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学童野球 1球速報 - gakudo-baseball-score</title>
  
  <!-- PWA マニフェスト ＆ テーマカラー設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1329">
  <meta name="background-color" content="#0b1329">

  <!-- iOS Safari 向け専用ホーム画面（PWA）設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="学童野球速報">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- ファビコン（タブ表示用） -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- ユーティリティCSS (Tailwind CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 分割CSSの読み込み -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body class="min-h-screen bg-[#0b1329] text-slate-100 font-sans select-none flex flex-col items-center p-2 sm:p-3">

  <!-- 1. アプリヘッダー (PC・スマホ両対応の2段レイアウト) -->
  <header class="w-full max-w-full md:max-w-7xl mb-2 flex flex-col gap-2 border-b border-slate-800 pb-2 flex-shrink-0">
    <!-- 上段：タイトル＆バージョン ＆ 【新設】炎天下モード ＆ 絵で見る捕手スコア盤ボタン -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl sm:text-2xl">⚾️</span>
        <h1 class="text-base sm:text-lg font-black text-emerald-400">学童野球 1球速報</h1>
        <span class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700 font-mono">v1.0 (PWA)</span>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- 【新設】真夏の河川敷直射日光・熱暴走防止「炎天下モード」切替トグル -->
        <button id="btn-toggle-sunlight" type="button" class="h-8 px-2 sm:px-2.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-amber-300 text-xs font-black rounded-xl border border-slate-700 flex items-center gap-1 shadow transition" title="真夏の直射日光・端末熱暴走防止（ペーパーホワイト）">
          <span class="text-sm">☀️</span>
          <span id="sunlight-btn-label">炎天下</span>
        </button>

        <!-- 【小学生捕手専用】絵で見る捕手スコア盤 ワンタップ呼出ボタン -->
        <button id="btn-open-catcher-board" type="button" class="h-8 px-2 sm:px-2.5 bg-gradient-to-r from-amber-500/20 to-amber-400/10 hover:from-amber-500/30 hover:to-amber-400/20 active:scale-95 text-amber-300 text-xs font-black rounded-xl border border-amber-400/40 flex items-center gap-1.5 shadow-md transition">
          <span class="text-sm">🎯</span>
          <span>捕手ボード</span>
        </button>
        <p class="text-[10px] text-slate-500 font-mono hidden md:block">gakudo-baseball-score</p>
      </div>
    </div>

    <!-- 下段：5等分均等アクションボタン（既存の大人の操作導線を100%維持） -->
    <div class="grid grid-cols-5 gap-1.5 sm:gap-2 w-full max-w-full sm:max-w-2xl">
      <button id="btn-open-roster" type="button" class="h-9 px-1 sm:px-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-sky-400 text-xs font-bold rounded-lg border border-sky-900/50 flex items-center justify-center gap-1 shadow transition">
        <span>📋</span>
        <span class="truncate">オーダー</span>
      </button>
      <button id="btn-open-scoresheet" type="button" class="h-9 px-1 sm:px-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-amber-400 text-xs font-bold rounded-lg border border-amber-900/50 flex items-center justify-center gap-1 shadow transition" title="公式記録サマリーシート（印刷・PDF）">
        <span>📄</span>
        <span class="truncate">スコア表</span>
      </button>
      <button id="btn-finish-game" type="button" class="h-9 px-1 sm:px-2 bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-white text-xs font-black rounded-lg border border-emerald-500 shadow flex items-center justify-center gap-1 transition" title="試合を確定してアーカイブへ保存">
        <span>🏁</span>
        <span class="truncate">試合終了</span>
      </button>
      <button id="btn-open-archive" type="button" class="h-9 px-1 sm:px-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-indigo-400 text-xs font-bold rounded-lg border border-indigo-900/50 flex items-center justify-center gap-1 shadow transition" title="保存済み過去試合一覧・アーカイブ">
        <span>📁</span>
        <span class="truncate">過去試合</span>
      </button>
      <button id="btn-undo" type="button" class="h-9 px-1 sm:px-2 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white text-xs font-bold rounded-lg flex items-center justify-center gap-1 shadow transition">
        <span>↺</span>
        <span class="truncate">1球取消</span>
      </button>
    </div>
  </header>

  <!-- 2. メインコンテンツ: PC(md以上)では左右均等2カラム、スマホでは縦1列 -->
  <div class="w-full max-w-full md:max-w-7xl flex-1 flex flex-col md:flex-row gap-3 items-start justify-center">
    
    <!-- 【左カラム】試合状況（スコアボード ＆ ランナー・BSO・走者ボタン ＆ 投球ログ） -->
    <div class="w-full md:w-1/2 flex flex-col gap-2.5">
      <!-- ① スコアボード & 球数・タイマー管理 -->
      <section id="scoreboard-slot" class="w-full">
        <!-- scoreboard.js が描画 -->
      </section>

      <!-- ② 走者ダイアモンド & BSOカウントランプ & 走者イベントボタン -->
      <section id="diamond-slot" class="w-full">
        <!-- runnerDiamond.js が描画 -->
      </section>

      <!-- ③ 直近投球ログスロット（runnerDiamond.js が自動生成・更新） -->
      <section id="log-slot" class="bg-slate-900 border border-slate-800 rounded-2xl p-2.5 shadow-md text-xs w-full min-h-[60px]">
        <!-- runnerDiamond.js がログテーブルを流し込み -->
      </section>
    </div>

    <!-- 【右カラム】投球入力コンソール（17分割盤面 & 判定ボタン） -->
    <div class="w-full md:w-1/2 flex flex-col">
      <main class="w-full">
        <section id="zone-slot">
          <!-- zone.js がプロ仕様コンソールを描画 -->
        </section>
      </main>
    </div>

  </div>

  <!-- 3. モーダルスロット -->
  <!-- 打球入力モーダル -->
  <div id="spray-modal-slot" class="hidden"></div>
  
  <!-- オーダー登録モーダル -->
  <div id="roster-modal-slot" class="hidden fixed inset-0 bg-black/80 z-40 p-3 overflow-y-auto flex items-center justify-center"></div>

  <!-- 公式記録サマリーシート（A4印刷・PDF出力）モーダル -->
  <div id="scoresheet-modal-slot" class="hidden"></div>

  <!-- 過去試合アーカイブ・履歴管理モーダル -->
  <div id="archive-modal-slot" class="hidden"></div>

  <!-- 【新設】絵で見る捕手スコア盤モーダルスロット -->
  <div id="catcher-modal-slot" class="hidden"></div>

  <!-- 投球履歴ピンポイント修正モーダル受皿スロット -->
  <div id="pitch-edit-modal-slot" class="hidden fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm overflow-y-auto p-2 sm:p-4 flex items-center justify-center select-none"></div>

  <!-- 【新設】ゲームセット・試合終了確認モーダル（正式保存 ＆ 二重安全弁） -->
  <div id="finish-game-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 select-none">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-4 sm:p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <div class="flex items-center gap-2">
          <span class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 flex items-center justify-center text-lg font-black">
            🏁
          </span>
          <div>
            <div class="text-[9px] text-emerald-400 font-extrabold tracking-widest uppercase">GAME SET & ARCHIVE</div>
            <h3 class="text-sm sm:text-base font-black text-white">ゲームセット（試合終了）の確認</h3>
          </div>
        </div>
        <button type="button" id="btn-close-finish-modal" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center font-bold text-sm">
          ✕
        </button>
      </div>

      <!-- 最終対戦結果カード -->
      <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-3 text-center space-y-1.5 shadow-inner">
        <div class="text-[10px] font-bold text-slate-400 flex items-center justify-center gap-1.5">
          <span>📅</span>
          <span id="finish-summary-date">-</span>
          <span>|</span>
          <span id="finish-summary-tournament">公式戦</span>
        </div>
        <div class="flex items-center justify-around py-1">
          <div class="w-28 text-right">
            <div class="text-xs font-black text-white truncate" id="finish-team-away">先攻チーム</div>
            <div class="text-[10px] text-slate-400">先攻</div>
          </div>
          <div class="flex items-baseline gap-1.5 font-mono">
            <span class="text-2xl font-black text-emerald-400" id="finish-score-away">0</span>
            <span class="text-slate-500 text-sm font-bold">─</span>
            <span class="text-2xl font-black text-amber-400" id="finish-score-home">0</span>
          </div>
          <div class="w-28 text-left">
            <div class="text-xs font-black text-white truncate" id="finish-team-home">後攻チーム</div>
            <div class="text-[10px] text-slate-400">後攻</div>
          </div>
        </div>
        <div class="text-[10px] font-bold text-slate-300 bg-slate-900/90 py-1 px-2 rounded-lg border border-slate-800" id="finish-pitch-count-info">
          総投球数: 0球 | 試合時間: 0分
        </div>
      </div>

      <p class="text-xs text-slate-300 leading-relaxed">
        この試合の全投球履歴、打順、個人成績を<span class="text-emerald-400 font-bold">「過去試合アーカイブ」へ永久保存</span>します。<br>
        <span class="text-[11px] text-slate-400">※保存完了後、メイン画面は新しい試合の準備状態に初期化されます。</span>
      </p>

      <!-- アクションボタン群 -->
      <div class="space-y-2 pt-1 border-t border-slate-800">
        <!-- メイン: 保存して終了 -->
        <button type="button" id="btn-confirm-save-finish" class="w-full py-2.5 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 active:scale-95 text-white font-black text-xs sm:text-sm rounded-xl shadow-lg transition flex items-center justify-center gap-1.5">
          <span>💾</span>
          <span>アーカイブに保存して試合終了</span>
        </button>

        <!-- サブボタングリッド -->
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btn-cancel-finish" class="py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 text-xs font-bold rounded-xl transition text-center">
            キャンセル（試合を続ける）
          </button>
          <button type="button" id="btn-discard-finish" class="py-2 bg-rose-950/40 hover:bg-rose-900/60 active:scale-95 text-rose-300 hover:text-white border border-rose-900/50 text-xs font-bold rounded-xl transition text-center" title="この試合データを保存せず破棄して初期化">
            保存せず初期化
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- リセット確認ダイアログ（誤操作を完全に防ぐ2段階モーダル） -->
  <div id="reset-confirm-modal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 select-none">
    <div class="bg-slate-900 border border-rose-900/60 rounded-2xl w-full max-w-sm p-4 shadow-2xl space-y-3">
      <div class="flex items-center gap-2 text-rose-400 border-b border-slate-800 pb-2">
        <span class="text-lg">⚠️</span>
        <h3 class="font-bold text-sm text-slate-100">試合データのリセット</h3>
      </div>
      <p class="text-xs text-slate-300 leading-relaxed">
        現在のカウント・スコア・投球履歴をすべて初期化します。<br>
        <span class="text-rose-400 font-bold">※この操作は取り消せません。</span>
      </p>
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
        <button type="button" id="btn-cancel-reset" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 text-xs font-bold rounded-lg transition">
          キャンセル
        </button>
        <button type="button" id="btn-confirm-reset" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white text-xs font-bold rounded-lg transition shadow-md">
          リセット実行
        </button>
      </div>
    </div>
  </div>

  <!-- 4. ES Modules エントリーポイント -->
  <script type="module" src="js/app.js"></script>

  <!-- 5. PWA Service Worker 登録スクリプト（電波なしオフライン稼働） -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then((reg) => {
            console.log("PWA サービスワーカー登録完了:", reg.scope);
          })
          .catch((err) => {
            console.warn("PWA サービスワーカー登録失敗:", err);
          });
      });
    }
  </script>
</body>
</html>
